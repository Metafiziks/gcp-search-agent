name: deploy

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "src/**"
      - "terraform/**"
      - "scripts/provision.sh"
      - "scripts/deploy.sh"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    if: ${{ vars.KB_ACCESS_MODE != 'protected' }}
    runs-on: ubuntu-latest

    env:
      PROJECT_ID:  ${{ secrets.PROJECT_ID }}
      ENV_NAME:    ${{ vars.ENV_NAME || 'search-agent' }}
      REGION:      ${{ vars.REGION || 'us-central1' }}
      GITHUB_REPO: ${{ github.repository }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the pushed range can span several commits; the next step diffs it

      - name: Detect which paths changed
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          # GitHub expressions cannot concatenate the commits' file lists, so diff the pushed range here.
          # A manual run, a new branch, or an unreachable previous commit runs every step.
          docs=false; code=false
          if [ "$EVENT" = workflow_dispatch ] || [ -z "$BEFORE" ] \
             || [ "$BEFORE" = 0000000000000000000000000000000000000000 ] \
             || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            docs=true; code=true
          else
            changed="$(git diff --name-only "$BEFORE" "$GITHUB_SHA")"
            grep -q '^docs/' <<<"$changed" && docs=true
            grep -qE '^(src/|terraform/|scripts/deploy\.sh$|scripts/provision\.sh$)' <<<"$changed" && code=true
          fi
          echo "docs=$docs"  >> "$GITHUB_OUTPUT"
          echo "code=$code"  >> "$GITHUB_OUTPUT"
          echo "docs changed: $docs, code changed: $code"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ADK + dependencies
        run: pip install google-adk google-genai google-cloud-discoveryengine -q

      - name: Sync docs to GCS + re-index (docs changes)
        if: steps.changes.outputs.docs == 'true'
        env:
          SEARCH_DATASTORE_ID: ${{ secrets.SEARCH_DATASTORE_ID }}
          DOCS_BUCKET: ${{ secrets.DOCS_BUCKET }}
        run: |
          gcloud storage rsync -r docs/ "gs://${DOCS_BUCKET}/docs/" --project="${PROJECT_ID}"
          python3 scripts/import_docs.py "$PROJECT_ID" "$SEARCH_DATASTORE_ID" "$DOCS_BUCKET"

      - name: Re-generate eval cases from updated docs
        if: steps.changes.outputs.docs == 'true'
        run: |
          PROJECT_ID="${PROJECT_ID}" REGION="${REGION}" \
            python3 scripts/generate_eval_cases.py
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/eval_cases.json
          git diff --cached --quiet || git commit -m "chore: regenerate eval cases from updated docs [skip ci]" && git push

      - name: Deploy agent to Cloud Run (agent/infra changes)
        if: steps.changes.outputs.code == 'true'
        env:
          SEARCH_DATASTORE_ID: ${{ secrets.SEARCH_DATASTORE_ID }}
        run: bash scripts/deploy.sh
